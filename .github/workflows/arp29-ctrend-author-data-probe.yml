name: ARP29 CTREND Author Data Probe

on:
  push:
    paths:
      - "marketsgpt-research/arp29_ctrend_author_data_probe.py"
      - ".github/workflows/arp29-ctrend-author-data-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Compile
        run: python -m py_compile marketsgpt-research/arp29_ctrend_author_data_probe.py
      - name: Probe public author factor data
        run: python marketsgpt-research/arp29_ctrend_author_data_probe.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: arp29-ctrend-author-data-probe
          path: marketsgpt-research/results/ARP29_CTREND_AUTHOR_*
      - name: Commit probe metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-research/results/ARP29_CTREND_AUTHOR_DATA_PROBE_20260915.json
          if git diff --cached --quiet; then
            echo "No probe metadata changes"
          else
            git commit -m "research: ARP29 CTREND author data probe [skip ci]"
            git push
          fi
