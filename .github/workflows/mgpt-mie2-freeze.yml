name: MGPT MIE2 Positioning Data Freeze
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-mie2/mie2_freeze.py"
      - "marketsgpt-mie2/MGPT_MIE2_POSITIONING_OI_LOCK_20260916.json"
      - ".github/workflows/mgpt-mie2-freeze.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgpt-mie2-writer
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check numpy pandas requests
      - run: python -m py_compile marketsgpt-mie2/mie2_freeze.py
      - name: Freeze official Binance positioning metrics only
        shell: bash
        run: |
          mkdir -p marketsgpt-mie2/results
          set +e
          python marketsgpt-mie2/mie2_freeze.py 2>&1 | tee marketsgpt-mie2/results/MGPT_MIE2_FREEZE_RUN_LOG_20260916.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > marketsgpt-mie2/results/MGPT_MIE2_FREEZE_EXIT_CODE_20260916.txt
          exit 0
      - name: Commit immutable MIE2 positioning evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-mie2/data marketsgpt-mie2/results/MGPT_MIE2_DATA_* marketsgpt-mie2/results/MGPT_MIE2_ARCHIVE_* marketsgpt-mie2/results/MGPT_MIE2_FREEZE_*
          if git diff --cached --quiet; then
            echo "No MIE2 freeze changes"
          else
            git commit -m "mie2 data: freeze Binance open-interest and positioning inputs"
            git pull --rebase origin main
            git push
          fi
      - name: Enforce freeze exit
        run: |
          rc="$(cat marketsgpt-mie2/results/MGPT_MIE2_FREEZE_EXIT_CODE_20260916.txt)"
          if [ "$rc" != "0" ]; then exit "$rc"; fi
