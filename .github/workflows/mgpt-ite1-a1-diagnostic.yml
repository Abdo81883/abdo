name: MGPT ITE1 A1 Diagnostic
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-ite1/ite1_a1_diagnostic.py"
      - ".github/workflows/mgpt-ite1-a1-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - run: python -m py_compile marketsgpt-ite1/ite1_a1_diagnostic.py
      - run: python marketsgpt-ite1/ite1_a1_diagnostic.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-ite1/results/MGPT_ITE1_A1_DIAGNOSTIC_*
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "diagnostics: ITE1 A1 architecture diagnosis [skip ci]"
            git push
          fi
