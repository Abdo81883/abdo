name: ARP24 LIQ1 Weekly Synthetic Spread Development

on:
  push:
    paths:
      - "marketsgpt-research/arp24_liq1.py"
      - "marketsgpt-research/ARP24_LIQ1_SYNTHETIC_SPREAD_WEEKLY_LOCK_20260915.json"
      - ".github/workflows/arp24-liq1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Compile evaluator
        run: python -m py_compile marketsgpt-research/arp24_liq1.py
      - name: Run frozen ARP24-LIQ1 development
        run: python marketsgpt-research/arp24_liq1.py
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: arp24-liq1-development
          path: marketsgpt-research/results/ARP24_LIQ1_*
      - name: Commit immutable result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add marketsgpt-research/results/ARP24_LIQ1_*
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "results: ARP24 LIQ1 development [skip ci]"
            git push
          fi
