name: MGPT IFE1 Diagnostic
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-ife1/ife1_diagnostic.py"
      - ".github/workflows/mgpt-ife1-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgpt-ife1-writer
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - run: python -m py_compile marketsgpt-ife1/ife1_diagnostic.py
      - run: python marketsgpt-ife1/ife1_diagnostic.py
      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-ife1/results/MGPT_IFE1_DIAGNOSTIC_*
          if git diff --cached --quiet; then echo "No diagnostic changes"; else
            git commit -m "diagnostics: IFE1 frozen development diagnosis [skip ci]"
            git push
          fi
