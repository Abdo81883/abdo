name: MGPT ITE1 E1 Development

on:
  push:
    branches:
      - "main"
      - "mgpt-ite1-institutional-trade-engine"
    paths:
      - "marketsgpt-ite1/ite1_core.py"
      - "marketsgpt-ite1/ite1_e1_development.py"
      - "marketsgpt-ite1/MGPT_ITE1_E1_DEVELOPMENT_LOCK_20260916.json"
      - ".github/workflows/mgpt-ite1-e1-development.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Compile frozen evaluator
        run: |
          python -m py_compile marketsgpt-ite1/ite1_core.py
          python -m py_compile marketsgpt-ite1/ite1_e1_development.py
      - name: Run E1 development only
        run: python marketsgpt-ite1/ite1_e1_development.py
      - name: Upload immutable E1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mgpt-ite1-e1-development
          path: marketsgpt-ite1/results/MGPT_ITE1_E1_*
      - name: Commit E1 result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-ite1/results/MGPT_ITE1_E1_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "results: ITE1 E1 development [skip ci]"
            git push
          fi
