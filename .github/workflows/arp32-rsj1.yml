name: ARP32 RSJ1 Terminal Development

on:
  push:
    paths:
      - "marketsgpt-research/arp32_rsj1.py"
      - "marketsgpt-research/ARP32_RSJ1_REALIZED_SIGNED_JUMP_LOCK_20260916.json"
      - ".github/workflows/arp32-rsj1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Compile evaluator
        run: python -m py_compile marketsgpt-research/arp32_rsj1.py
      - name: Run frozen terminal RSJ development
        run: python marketsgpt-research/arp32_rsj1.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: arp32-rsj1-development
          path: marketsgpt-research/results/ARP32_RSJ1_*
      - name: Commit immutable result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-research/results/ARP32_RSJ1_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "results: ARP32 RSJ1 development [skip ci]"
            git push
          fi
