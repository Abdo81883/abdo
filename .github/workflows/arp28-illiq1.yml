name: ARP28 ILLIQ1 Weekly Amihud Development

on:
  push:
    paths:
      - "marketsgpt-research/arp28_illiq1.py"
      - "marketsgpt-research/ARP28_ILLIQ1_AMIHUD_WEEKLY_LOCK_20260915.json"
      - ".github/workflows/arp28-illiq1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Compile evaluator
        run: python -m py_compile marketsgpt-research/arp28_illiq1.py
      - name: Run frozen ARP28 development
        run: python marketsgpt-research/arp28_illiq1.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: arp28-illiq1-development
          path: marketsgpt-research/results/ARP28_ILLIQ1_*
      - name: Commit immutable result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-research/results/ARP28_ILLIQ1_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "results: ARP28 ILLIQ1 development [skip ci]"
            git push
          fi
