name: MGPT IFE1 Development Meta-Decision
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-ife1/ife1_evaluate.py"
      - "marketsgpt-ife1/MGPT_IFE1_PROGRAM_LOCK_20260916.json"
      - "marketsgpt-ife1/MGPT_IFE1_IMPLEMENTATION_SPEC_V1_20260916.json"
      - ".github/workflows/mgpt-ife1-evaluate.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgpt-ife1-writer
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install frozen evaluator dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn joblib
      - name: Compile IFE1 evaluator
        run: |
          python -m py_compile marketsgpt-ite1/ite1_core.py
          python -m py_compile marketsgpt-ite1/ite1_terminal_common.py
          python -m py_compile marketsgpt-ife1/ife1_evaluate.py
      - name: Run fit and untouched development screen only
        shell: bash
        run: |
          mkdir -p marketsgpt-ife1/results
          set +e
          python marketsgpt-ife1/ife1_evaluate.py 2>&1 | tee marketsgpt-ife1/results/MGPT_IFE1_RUN_LOG_20260916.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > marketsgpt-ife1/results/MGPT_IFE1_EXIT_CODE_20260916.txt
          exit 0
      - name: Commit immutable IFE1 development evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-ife1/results/MGPT_IFE1_*
          if git diff --cached --quiet; then
            echo "No IFE1 result changes"
          else
            git commit -m "results: IFE1 frozen meta-decision development [skip ci]"
            git push
          fi
      - name: Enforce evaluator exit
        run: |
          rc="$(cat marketsgpt-ife1/results/MGPT_IFE1_EXIT_CODE_20260916.txt)"
          if [ "$rc" != "0" ]; then exit "$rc"; fi
