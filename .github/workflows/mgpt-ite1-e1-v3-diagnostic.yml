name: MGPT ITE1 E1 V3 Diagnostic

on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-ite1/ite1_e1_v3_diagnostic.py"
      - ".github/workflows/mgpt-ite1-e1-v3-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - run: |
          python -m py_compile marketsgpt-ite1/ite1_core.py
          python -m py_compile marketsgpt-ite1/ite1_e1_v3_diagnostic.py
      - name: Diagnose rejected E1 development architecture
        run: python marketsgpt-ite1/ite1_e1_v3_diagnostic.py
      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-ite1/results/MGPT_ITE1_E1_V3_DIAGNOSTIC_*
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "diagnostics: ITE1 E1 V3 architecture diagnosis [skip ci]"
            git push
          fi
