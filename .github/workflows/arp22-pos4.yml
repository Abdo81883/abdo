name: ARP22 POS4 Independent Time Replication

on:
  push:
    paths:
      - "marketsgpt-research/ARP22_POS4_INDEPENDENT_TIME_REPLICATION_LOCK_20260915.json"
      - "marketsgpt-research/arp22_pos4.py"
      - "marketsgpt-research/arp22_pos4_sanity.py"
      - ".github/workflows/arp22-pos4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Compile and sanity-check frozen evaluator
        run: |
          cd marketsgpt-research
          python -m py_compile arp22_pos4.py arp22_pos4_sanity.py
          python arp22_pos4_sanity.py
      - name: Run frozen ARP22-POS4 development
        run: python marketsgpt-research/arp22_pos4.py
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: arp22-pos4-development
          path: marketsgpt-research/results/ARP22_POS4_*
      - name: Commit immutable result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-research/results/ARP22_POS4_*
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "results: ARP22 POS4 development [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

