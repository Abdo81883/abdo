name: ARP21 FPRV Exact R2 Development

on:
  push:
    paths:
      - "marketsgpt-research/arp21_fprv_exact_r2.py"

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Run frozen R2 development
        run: python marketsgpt-research/arp21_fprv_exact_r2.py
      - name: Upload development evidence
        uses: actions/upload-artifact@v4
        with:
          name: arp21-fprv-exact-r2-development
          path: marketsgpt-research/results/ARP21_FPRV_EXACT_R2_*
      - name: Commit immutable result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-research/results/ARP21_FPRV_EXACT_R2_*
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "results: ARP21 FPRV exact R2 development [skip ci]"
            git push
          fi
