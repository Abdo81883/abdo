name: MGPT IFE1 Data Freeze
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-ife1/ife1_freeze.py"
      - "marketsgpt-ife1/MGPT_IFE1_PROGRAM_LOCK_20260916.json"
      - ".github/workflows/mgpt-ife1-freeze.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgpt-ife1-writer
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pandas yfinance
      - run: python -m py_compile marketsgpt-ife1/ife1_freeze.py
      - name: Freeze IFE1 development/context data only
        shell: bash
        run: |
          mkdir -p marketsgpt-ife1/results
          set +e
          python marketsgpt-ife1/ife1_freeze.py 2>&1 | tee marketsgpt-ife1/results/MGPT_IFE1_FREEZE_RUN_LOG_20260916.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > marketsgpt-ife1/results/MGPT_IFE1_FREEZE_EXIT_CODE_20260916.txt
          exit 0
      - name: Commit immutable IFE1 input evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-ife1/data marketsgpt-ife1/results/MGPT_IFE1_DATA_* marketsgpt-ife1/results/MGPT_IFE1_FREEZE_*
          if git diff --cached --quiet; then
            echo "No IFE1 freeze changes"
          else
            git commit -m "ife1 data: freeze fit/development and causal context inputs"
            git push
          fi
      - name: Enforce freeze exit
        run: |
          rc="$(cat marketsgpt-ife1/results/MGPT_IFE1_FREEZE_EXIT_CODE_20260916.txt)"
          if [ "$rc" != "0" ]; then exit "$rc"; fi
