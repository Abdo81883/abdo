name: ARP27 TVOL1 CoinGecko Probe

on:
  push:
    paths:
      - "marketsgpt-research/arp27_tvol1_coingecko_probe.py"
      - ".github/workflows/arp27-tvol1-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile
        run: python -m py_compile marketsgpt-research/arp27_tvol1_coingecko_probe.py
      - name: Run provider/mapping probe only
        run: python marketsgpt-research/arp27_tvol1_coingecko_probe.py
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: arp27-tvol1-coingecko-probe
          path: marketsgpt-research/results/ARP27_TVOL1_COINGECKO_PROBE_*
      - name: Commit probe evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-research/results/ARP27_TVOL1_COINGECKO_PROBE_*
          if git diff --cached --quiet; then
            echo "No probe changes"
          else
            git commit -m "results: ARP27 CoinGecko transport probe [skip ci]"
            git push
          fi
