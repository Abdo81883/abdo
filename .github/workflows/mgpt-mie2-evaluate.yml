name: MGPT MIE2 Positioning Development Gate
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-mie2/mie2_evaluate.py"
      - "marketsgpt-mie2/MGPT_MIE2_POSITIONING_OI_LOCK_20260916.json"
      - "marketsgpt-mie2/MGPT_MIE2_IMPLEMENTATION_SPEC_V1_20260916.json"
      - "marketsgpt-mie2/results/MGPT_MIE2_DATA_FREEZE_STATUS_20260916.json"
      - ".github/workflows/mgpt-mie2-evaluate.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgpt-mie2-writer
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install evaluator dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn joblib
      - name: Compile MIE2 evaluator
        run: python -m py_compile marketsgpt-mie2/mie2_evaluate.py
      - name: Run frozen pairwise positioning development screen only
        shell: bash
        run: |
          mkdir -p marketsgpt-mie2/results
          set +e
          python marketsgpt-mie2/mie2_evaluate.py 2>&1 | tee marketsgpt-mie2/results/MGPT_MIE2_RUN_LOG_20260916.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > marketsgpt-mie2/results/MGPT_MIE2_EXIT_CODE_20260916.txt
          exit 0
      - name: Commit immutable MIE2 development evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-mie2/results/MGPT_MIE2_*
          if git diff --cached --quiet; then
            echo "No MIE2 result changes"
          else
            git commit -m "results: MIE2 positioning development [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Enforce evaluator exit
        run: |
          rc="$(cat marketsgpt-mie2/results/MGPT_MIE2_EXIT_CODE_20260916.txt)"
          if [ "$rc" != "0" ]; then exit "$rc"; fi
