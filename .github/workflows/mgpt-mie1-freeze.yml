name: MGPT MIE1 Microstructure Data Freeze
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-mie1/mie1_freeze.py"
      - "marketsgpt-mie1/MGPT_MIE1_MICROSTRUCTURE_LOCK_20260916.json"
      - ".github/workflows/mgpt-mie1-freeze.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgpt-mie1-writer
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pandas requests
      - run: python -m py_compile marketsgpt-mie1/mie1_freeze.py
      - name: Freeze official Binance microstructure inputs only
        shell: bash
        run: |
          mkdir -p marketsgpt-mie1/results
          set +e
          python marketsgpt-mie1/mie1_freeze.py 2>&1 | tee marketsgpt-mie1/results/MGPT_MIE1_FREEZE_RUN_LOG_20260916.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > marketsgpt-mie1/results/MGPT_MIE1_FREEZE_EXIT_CODE_20260916.txt
          exit 0
      - name: Commit immutable MIE1 input evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-mie1/data marketsgpt-mie1/results/MGPT_MIE1_DATA_* marketsgpt-mie1/results/MGPT_MIE1_FREEZE_*
          if git diff --cached --quiet; then
            echo "No MIE1 freeze changes"
          else
            git commit -m "mie1 data: freeze Binance microstructure and funding inputs"
            git push
          fi
      - name: Enforce freeze exit
        run: |
          rc="$(cat marketsgpt-mie1/results/MGPT_MIE1_FREEZE_EXIT_CODE_20260916.txt)"
          if [ "$rc" != "0" ]; then exit "$rc"; fi
