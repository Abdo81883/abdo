name: MGPT ITE1 B1 Data Freeze
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-ite1/ite1_b1_freeze.py"
      - "marketsgpt-ite1/MGPT_ITE1_B1_RANGE_REVERSION_LOCK_20260916.json"
      - ".github/workflows/mgpt-ite1-b1-freeze.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pandas yfinance
      - run: python -m py_compile marketsgpt-ite1/ite1_b1_freeze.py
      - name: Freeze fresh data only
        shell: bash
        run: |
          mkdir -p marketsgpt-ite1/results
          set +e
          python marketsgpt-ite1/ite1_b1_freeze.py 2>&1 | tee marketsgpt-ite1/results/MGPT_ITE1_B1_FREEZE_RUN_LOG_20260916.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > marketsgpt-ite1/results/MGPT_ITE1_B1_FREEZE_EXIT_CODE_20260916.txt
          exit 0
      - name: Commit frozen inputs/evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-ite1/data/b1_fresh marketsgpt-ite1/results/MGPT_ITE1_B1_*
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "ite1 data: freeze B1 fresh-instrument inputs"
            git push
          fi
      - name: Enforce freeze exit
        run: |
          rc="$(cat marketsgpt-ite1/results/MGPT_ITE1_B1_FREEZE_EXIT_CODE_20260916.txt)"
          if [ "$rc" != "0" ]; then exit "$rc"; fi
