name: MGPT MIE1 Microstructure Development Gate
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-mie1/mie1_evaluate.py"
      - "marketsgpt-mie1/MGPT_MIE1_MICROSTRUCTURE_LOCK_20260916.json"
      - "marketsgpt-mie1/MGPT_MIE1_IMPLEMENTATION_SPEC_V1_20260916.json"
      - "marketsgpt-mie1/results/MGPT_MIE1_DATA_FREEZE_STATUS_20260916.json"
      - ".github/workflows/mgpt-mie1-evaluate.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgpt-mie1-writer
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install evaluator dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn joblib
      - name: Compile MIE1 evaluator
        run: python -m py_compile marketsgpt-mie1/mie1_evaluate.py
      - name: Run frozen MIE1 fit and development screen only
        shell: bash
        run: |
          mkdir -p marketsgpt-mie1/results
          set +e
          python marketsgpt-mie1/mie1_evaluate.py 2>&1 | tee marketsgpt-mie1/results/MGPT_MIE1_RUN_LOG_20260916.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > marketsgpt-mie1/results/MGPT_MIE1_EXIT_CODE_20260916.txt
          exit 0
      - name: Commit immutable MIE1 development evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-mie1/results/MGPT_MIE1_*
          if git diff --cached --quiet; then
            echo "No MIE1 result changes"
          else
            git commit -m "results: MIE1 microstructure development [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Enforce evaluator exit
        run: |
          rc="$(cat marketsgpt-mie1/results/MGPT_MIE1_EXIT_CODE_20260916.txt)"
          if [ "$rc" != "0" ]; then exit "$rc"; fi
