name: ARP22 POS2 Historical Positioning Development

on:
  push:
    paths:
      - "marketsgpt-research/arp22_pos2.py"
      - "marketsgpt-research/ARP22_POS2_HISTORICAL_POSITIONING_REPLICATION_LOCK_20260915.json"
      - ".github/workflows/arp22-pos2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arp22-pos2-development
  cancel-in-progress: false

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Compile evaluator
        run: python -m py_compile marketsgpt-research/arp22_pos2.py
      - name: Verify frozen lock
        run: |
          echo "6cd7d923ff008ee4c479a660f7fccf021aea43faf883ecd62f75095a0813b12c  marketsgpt-research/ARP22_POS2_HISTORICAL_POSITIONING_REPLICATION_LOCK_20260915.json" | sha256sum -c -
      - name: Run frozen ARP22-POS2 development
        run: python marketsgpt-research/arp22_pos2.py
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: arp22-pos2-development
          path: marketsgpt-research/results/ARP22_POS2_*
      - name: Commit immutable result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-research/results/ARP22_POS2_*
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "results: ARP22 POS2 development [skip ci]"
            git pull --rebase origin main
            git push
          fi
