name: MGPT IFE2 Development Distributional Gate
on:
  push:
    branches: ["main"]
    paths:
      - "marketsgpt-ife2/ife2_evaluate.py"
      - "marketsgpt-ife2/MGPT_IFE2_DISTRIBUTIONAL_OPPORTUNITY_LOCK_20260916.json"
      - "marketsgpt-ife2/MGPT_IFE2_IMPLEMENTATION_SPEC_V1_20260916.json"
      - ".github/workflows/mgpt-ife2-evaluate.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mgpt-ife2-writer
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install evaluator dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn joblib
      - name: Compile IFE2 evaluator
        run: |
          python -m py_compile marketsgpt-ite1/ite1_core.py
          python -m py_compile marketsgpt-ite1/ite1_terminal_common.py
          python -m py_compile marketsgpt-ife2/ife2_evaluate.py
      - name: Run fit and untouched IFE2 development screen only
        shell: bash
        run: |
          mkdir -p marketsgpt-ife2/results
          set +e
          python marketsgpt-ife2/ife2_evaluate.py 2>&1 | tee marketsgpt-ife2/results/MGPT_IFE2_RUN_LOG_20260916.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > marketsgpt-ife2/results/MGPT_IFE2_EXIT_CODE_20260916.txt
          exit 0
      - name: Commit immutable IFE2 development evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-ife2/results/MGPT_IFE2_*
          if git diff --cached --quiet; then
            echo "No IFE2 result changes"
          else
            git commit -m "results: IFE2 distributional development [skip ci]"
            git push
          fi
      - name: Enforce evaluator exit
        run: |
          rc="$(cat marketsgpt-ife2/results/MGPT_IFE2_EXIT_CODE_20260916.txt)"
          if [ "$rc" != "0" ]; then exit "$rc"; fi
