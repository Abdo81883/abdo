name: ARP30 XCR1 BTC Lead-Lag Development

on:
  push:
    paths:
      - "marketsgpt-research/arp30_xcr1_btc_leadlag.py"
      - "marketsgpt-research/ARP30_XCR1_BTC_LEADLAG_LOCK_20260916.json"
      - ".github/workflows/arp30-xcr1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Compile evaluator
        run: python -m py_compile marketsgpt-research/arp30_xcr1_btc_leadlag.py
      - name: Run frozen BTC lead-lag development
        run: python marketsgpt-research/arp30_xcr1_btc_leadlag.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: arp30-xcr1-development
          path: marketsgpt-research/results/ARP30_XCR1_*
      - name: Commit immutable result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketsgpt-research/results/ARP30_XCR1_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "results: ARP30 XCR1 development [skip ci]"
            git push
          fi
